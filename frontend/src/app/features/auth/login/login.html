<section class="login-page">

  <div class="login-card">

    <h1>Welcome Back</h1>

    <p>Login to access your AI dashboard</p>


    <form (ngSubmit)="login()">


      <input
        type="email"
        placeholder="Email"
        [(ngModel)]="loginData.email"
        name="email"
        required
      />


      <input
        type="password"
        placeholder="Password"
        [(ngModel)]="loginData.password"
        name="password"
        required
      />


      <p class="error" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>


      <button 
        type="submit"
        [disabled]="loading">

        {{ loading ? 'Logging in...' : 'Login' }}

      </button>


      <p class="signup-link">

        Don't have an account?

        <a routerLink="/signup">
          Create Account
        </a>

      </p>


    </form>


  </div>

</section>
